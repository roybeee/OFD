name: Publish verified V2 screens

on:
  push:
    branches: [agent/ofd-one-process-v2]

permissions:
  actions: read
  contents: write

jobs:
  evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the matching green Chromium run and download its screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow v2.yml --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh run download "$run_id" --repo "${GITHUB_REPOSITORY}" --name v2-e2e-screens-and-report --dir .verified-screens
      - name: Keep the three review surfaces in the branch
        run: |
          mkdir -p docs/screenshots/v2
          for name in hq-desktop.png store-mobile.png driver-mobile.png; do
            source_path="$(find .verified-screens -type f -name "$name" -print -quit)"
            test -n "$source_path"
            cp "$source_path" "docs/screenshots/v2/$name"
            test -s "docs/screenshots/v2/$name"
          done
      - name: Commit immutable review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/v2
          git diff --cached --quiet && exit 0
          git commit -m "검증된 V2 실화면 증빙 추가"
          git push origin "HEAD:${GITHUB_REF_NAME}"
