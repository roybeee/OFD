name: Review npm lockfile consistency

on:
  workflow_dispatch:
  push:
    branches: [agent/ofd-one-process-v2]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
      - name: Use the repository npm version
        run: npm install --global npm@11.11.1
      - name: Resolve the dependency graph without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Detect a lockfile update
        id: lockfile
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- package-lock.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the resolved lockfile is reproducible
        run: npm ci --ignore-scripts
      - name: Validate dependency-free platform contracts
        run: npm run test:platform
      - name: Upload changed lockfile for review and commit
        if: steps.lockfile.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-lock-node-22-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
