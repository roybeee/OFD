name: Bootstrap npm lockfile artifact

on:
  workflow_dispatch:
  push:
    branches: [agent/ofd-one-process-v2]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Use the repository npm version
        run: npm install --global npm@11.11.1
      - name: Resolve the reviewed dependency graph without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify the generated lockfile is reproducible
        run: npm ci --ignore-scripts
      - name: Verify production dependencies are free of high vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Commit the verified lockfile to this feature branch
        if: github.event_name == 'push'
        run: |
          git diff --quiet -- package-lock.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "검증된 보안 패키지 잠금파일 갱신"
          git push origin "HEAD:${GITHUB_REF_NAME}"
