name: V2 quality gate

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

concurrency:
  group: v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ofd_v2_test
          POSTGRES_USER: ofd
          POSTGRES_PASSWORD: ofd-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofd -d ofd_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_MODE: test
      REPOSITORY_MODE: memory
      DATABASE_URL: postgresql://ofd:ofd-ci-only@127.0.0.1:5432/ofd_v2_test
      PROVIDER_MODE: mock
      STORAGE_MODE: mock
      EMAIL_PROVIDER: mock
      POPBILL_PRODUCTION_ENABLED: "false"
      VITE_DEMO_MODE: "false"
      KOREA_HOLIDAYS: 2026-01-01,2026-03-01,2026-05-05,2026-08-15,2026-10-03,2026-10-09,2026-12-25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require committed npm lockfile
        run: test -f package-lock.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.11.1
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Production fail-closed preflight (providers disabled)
        run: |
          export SESSION_SECRET="$(openssl rand -base64 48)"
          export ENCRYPTION_KEY="$(openssl rand -base64 32)"
          npm run preflight
          node infra/scripts/deploy/preflight.mjs api
        env:
          NODE_ENV: production
          APP_MODE: production
          REPOSITORY_MODE: postgres
          DATABASE_URL: postgresql://ofd:strong-password@db.internal/ofd
          PUBLIC_APP_URL: https://workstation.example.kr
          WEB_ORIGIN: https://workstation.example.kr
          SESSION_COOKIE_SECURE: "true"
          STORAGE_MODE: s3
          S3_REGION: ap-northeast-2
          S3_BUCKET: ofd-production-documents
          S3_KMS_KEY_ID: alias/ofd-production
          EMAIL_PROVIDER: smtp
          SMTP_HOST: smtp.example.kr
          EMAIL_FROM: no-reply@ofd.example.kr
          PROVIDER_MODE: mock
          POPBILL_PRODUCTION_ENABLED: "false"
          API_HOST: 0.0.0.0
          API_PORT: "4100"
          RELEASE_SHA: ${{ github.sha }}
      - name: Apply migrations to CI PostgreSQL
        run: npm run migrate -w @ofd/db
      - run: npm run test:ci
      - name: Smoke-test compiled test-mode API against migrated PostgreSQL
        run: node infra/scripts/deploy/smoke-postgres-runtime.mjs
        env:
          APP_MODE: test
          REPOSITORY_MODE: postgres

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ofd_v2_e2e
          POSTGRES_USER: ofd
          POSTGRES_PASSWORD: ofd-e2e-isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofd -d ofd_v2_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_MODE: test
      TEST_AUTH_REQUIRED: "true"
      REPOSITORY_MODE: postgres
      DATABASE_URL: postgresql://ofd:ofd-e2e-isolated@127.0.0.1:5432/ofd_v2_e2e
      PROVIDER_MODE: mock
      STORAGE_MODE: mock
      EMAIL_PROVIDER: mock
      POPBILL_PRODUCTION_ENABLED: "false"
      POPBILL_TAX_INVOICE_ENABLED: "false"
      POPBILL_BANK_SYNC_ENABLED: "false"
      POPBILL_SMS_ENABLED: "false"
      POPBILL_WEBHOOK_API_KEY: e2e-webhook-c715bad7bf7196538d40dbf31d8569b7
      SESSION_SECRET: e2e-session-4f64b77ebf52f272b7d9f8f7910832829c95bb83df4de798
      ENCRYPTION_KEY: Y7XV5T6vzYD9OtYf85rHuuaSNmrYovfzmvFihTbqpSI=
      E2E_ALLOW_RESET: "1"
      E2E_SKIP_PREPARE: "1"
      VITE_DEMO_MODE: "false"
      VITE_ALLOW_TEST_API: "true"
      VITE_API_BASE: /api/v2
      KOREA_HOLIDAYS: 2026-01-01,2026-03-01,2026-05-05,2026-08-15,2026-10-03,2026-10-09,2026-12-25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require committed npm lockfile
        run: test -f package-lock.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.11.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build shared V2 packages
        run: npm run build:packages
      - name: Apply migrations 001-004 to isolated E2E PostgreSQL
        run: npm run migrate -w @ofd/db
      - name: Seed deterministic isolated V2 actors and catalog
        run: node e2e/seed-postgres.mjs
      - name: Verify V2 E2E stack safety contracts
        run: node --test e2e/stack-contract.test.mjs
      - name: Run real V2 Web + API + Worker journeys
        run: npm run e2e
      - name: Upload real-screen review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2-e2e-screens-and-report
          path: |
            test-results/e2e
            test-results/e2e-junit.xml
            playwright-report
          retention-days: 14

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip deploy]')
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: ofd-production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      RENDER_WORKER_SERVICE_ID: ${{ vars.RENDER_WORKER_SERVICE_ID }}
      RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
      RENDER_SERVICE_TIMEOUT_MS: "900000"
      RENDER_DEPLOY_MANIFEST: render-deploy-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
      - name: Deploy API with predeploy migration, then worker, then Web
        run: node infra/scripts/deploy/trigger-render-deploy.mjs
      - name: Upload Render deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-production-deploy-${{ github.sha }}
          path: render-deploy-manifest.json
          if-no-files-found: warn
          retention-days: 30
