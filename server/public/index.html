<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFD 워크스테이션</title>
<style>
html,body{margin:0;padding:0;background:#EFEAE1}
#app, #app * { box-sizing:border-box; margin:0; padding:0; }
#app input, #app textarea, #app select, #app button { font-family:inherit; }
#app{
  --bg:#FAF7F2; --sur:#FFFFFF; --ink:#1F2430; --line:#E7E0D6;
  --dim:#8B8577; --dimmer:#B5AE9F;
  --sig:#F26B21; --deep:#C24E10; --soft:#FDEBDD;
  --ok:#1F9D55; --oksoft:#E6F4EC; --warn:#B7791F; --warnsoft:#FCF3E3;
  --risk:#C53030; --risksoft:#FBEAEA; --info:#2B6CB0; --infosoft:#E8F0F9;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',
    -apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-size:14px; line-height:1.5; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums; display:flex; flex-direction:column;
  max-width:1240px; margin:0 auto;
}
#app .boot{padding:60px;color:var(--dim);font-size:13px}
#app .top{background:var(--sur);border-bottom:1px solid var(--line);
  padding:13px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#app .logo{display:flex;align-items:center;gap:9px}
#app .logo .dot{width:12px;height:12px;border-radius:4px;background:var(--sig)}
#app .logo b{font-size:15px;font-weight:800;letter-spacing:-.03em}
#app .logo span{font-size:9px;color:var(--dimmer);letter-spacing:.12em;font-weight:700}
#app .sess{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#app .sess .who{font-size:12px;font-weight:800;color:var(--deep);background:var(--soft);
  padding:5px 11px;border-radius:20px}
#app .tabs{background:var(--sur);border-bottom:1px solid var(--line);
  padding:0 14px;display:flex;gap:2px;overflow-x:auto}
#app .tabs button{background:none;border:0;border-bottom:2.5px solid transparent;
  padding:11px 12px;font:inherit;font-size:13px;color:var(--dim);cursor:pointer;
  white-space:nowrap;font-weight:600;transition:.13s}
#app .tabs button:hover{color:var(--ink)}
#app .tabs button.on{color:var(--sig);border-bottom-color:var(--sig);font-weight:800}
#app .main{flex:1;overflow-y:auto;padding:20px;min-width:0}
#app .head{display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:15px;gap:14px;flex-wrap:wrap}
#app .head h1{font-size:18px;font-weight:800;letter-spacing:-.03em}
#app .head p{font-size:11.5px;color:var(--dim);margin-top:3px}
#app .panel{background:var(--sur);border:1px solid var(--line);border-radius:11px;
  padding:15px;margin-bottom:13px}
#app .panel-h{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:11px;gap:10px;flex-wrap:wrap}
#app .panel-h h2{font-size:13.5px;font-weight:800;letter-spacing:-.02em}
#app .panel-h .meta{font-size:11px;color:var(--dim)}
#app .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:13px}
#app .kpi{background:var(--sur);border:1px solid var(--line);border-radius:10px;padding:12px}
#app .kpi .k{font-size:10px;color:var(--dim);font-weight:700}
#app .kpi .v{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1}
#app .kpi .v em{font-size:11px;font-style:normal;color:var(--dim);font-weight:600;margin-left:2px}
#app .kpi .s{font-size:10px;color:var(--dimmer);margin-top:6px}
#app .pill{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:20px;
  white-space:nowrap;display:inline-block;border:1px solid transparent}
#app .pl-wait{background:var(--warnsoft);color:var(--warn)}
#app .pl-ok{background:var(--oksoft);color:var(--ok)}
#app .pl-info{background:var(--infosoft);color:var(--info)}
#app .pl-risk{background:var(--risksoft);color:var(--risk)}
#app .pl-dim{background:#F1EDE5;color:var(--dim)}
#app .pl-sig{background:var(--soft);color:var(--deep)}
#app .kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
#app .kb-col{min-width:196px;flex:1;background:#F4F0E8;border:1px solid var(--line);
  border-radius:10px;padding:9px}
#app .kb-col h3{font-size:11px;font-weight:800;color:var(--dim);padding:2px 4px 8px;
  display:flex;justify-content:space-between}
#app .kb-col h3 i{font-style:normal;color:var(--dimmer)}
#app .card{background:var(--sur);border:1px solid var(--line);border-radius:8px;
  padding:10px;margin-bottom:8px;cursor:pointer;transition:.12s}
#app .card:hover{border-color:var(--sig)}
#app .card.sel{border-color:var(--sig);box-shadow:0 0 0 2px var(--soft)}
#app .card b{font-size:12.5px;font-weight:700;display:block}
#app .card .a{font-size:10.5px;color:var(--dim);margin-top:2px}
#app .card .g{font-size:10px;margin-top:6px;font-weight:700}
#app .card .mv{display:flex;gap:5px;margin-top:8px}
#app .card .mv button{flex:1;background:#F4F0E8;border:1px solid var(--line);
  border-radius:5px;padding:4px 0;font-size:11px;cursor:pointer;color:var(--dim)}
#app .card .mv button:hover{color:var(--ink);border-color:var(--dim)}
#app input,#app textarea,#app select{background:var(--sur);border:1px solid var(--line);
  border-radius:7px;color:var(--ink);padding:8px 10px;font-size:13px;width:100%}
#app input:focus,#app textarea:focus,#app select:focus{outline:2px solid var(--sig);outline-offset:-1px}
#app textarea{resize:vertical;min-height:64px}
#app label{display:block;font-size:10px;color:var(--dim);font-weight:700;margin-bottom:4px}
#app .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
#app .row>div{flex:1;min-width:120px}
#app .btn{background:var(--sig);color:#fff;border:0;border-radius:7px;padding:9px 15px;
  font-size:13px;font-weight:700;cursor:pointer;transition:.12s;white-space:nowrap}
#app .btn:hover{background:var(--deep)}
#app .btn.ghost{background:none;border:1px solid var(--line);color:var(--dim)}
#app .btn.ghost:hover{color:var(--ink);border-color:var(--dim)}
#app .btn.sm{padding:5px 10px;font-size:11px}
#app .btn.danger{background:none;border:1px solid var(--risksoft);color:var(--risk)}
#app .btn.danger:hover{background:var(--risksoft)}
#app .chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink)}
#app .chk input{width:auto}
#app table{width:100%;border-collapse:collapse;font-size:12.5px}
#app th{text-align:left;font-size:10px;color:var(--dim);font-weight:800;
  padding:8px 9px;border-bottom:1.5px solid var(--line);white-space:nowrap}
#app td{padding:8px 9px;border-bottom:1px solid #F1EDE5;vertical-align:middle}
#app tr:last-child td{border-bottom:0}
#app td.num,#app th.num{text-align:right}
#app .qty{width:70px;text-align:right;padding:6px 8px}
#app .bars{display:flex;align-items:flex-end;gap:5px;height:96px;padding-top:6px}
#app .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:4px;min-width:0}
#app .bars .b i{width:100%;background:var(--sig);border-radius:3px 3px 0 0;min-height:2px}
#app .bars .b span{font-size:8.5px;color:var(--dimmer);white-space:nowrap}
#app .note{font-size:11px;color:var(--dim);line-height:1.6;background:#F7F3EB;
  border-left:2.5px solid var(--sig);padding:10px 12px;border-radius:0 7px 7px 0;margin-top:11px}
#app .empty{color:var(--dimmer);font-size:12px;padding:18px 0;text-align:center}
#app .gatewrap{flex:1;display:flex;align-items:center;justify-content:center;padding:30px}
#app .gate{width:100%;max-width:680px}
#app .gate .gt{text-align:center;margin-bottom:22px}
#app .gate .gt b{font-size:20px;font-weight:800}
#app .gate .gt p{font-size:12px;color:var(--dim);margin-top:5px}
#app .gate .cols{display:flex;gap:14px;flex-wrap:wrap}
#app .gate .cols>.panel{flex:1;min-width:260px;margin:0}
#app .code{letter-spacing:.35em;font-weight:800;text-align:center;font-size:16px}
#app .reveal{background:var(--oksoft);border:1.5px solid var(--ok);border-radius:9px;
  padding:12px;margin:10px 0;font-size:13px}
#app .reveal b{font-size:19px;letter-spacing:.3em}
#app .logrow{font-size:11px;color:var(--dim);padding:6px 0;border-bottom:1px solid #F1EDE5;
  display:flex;gap:10px}
#app .logrow .lt{color:var(--dimmer);white-space:nowrap}
#app .logrow .lw{font-weight:800;color:var(--deep);white-space:nowrap}
@media(max-width:760px){#app .main{padding:13px}#app .kb-col{min-width:180px}#app .sess{margin-left:0;width:100%}}
</style>
</head>
<body>
<div id="app"><div class="boot">불러오는 중…</div></div>
<script>
(function(){
const $=document.getElementById('app');
const STAGES=['리드','상담','정보공개서 제공','가맹계약','실사·공사','오픈완료'];
const OSTAT=['대기','승인','입금확인','출고','완료'];
const OSCLS={'대기':'pl-wait','승인':'pl-info','입금확인':'pl-sig','출고':'pl-info','완료':'pl-ok'};

/* ---- utils ---- */
const pad=n=>String(n).padStart(2,'0');
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const diffD=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const isWknd=s=>{const w=new Date(s+'T00:00:00').getDay();return w===0||w===6;};
const md=s=>s?s.slice(5).replace('-','.'):'';
const won=n=>n.toLocaleString('ko-KR');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---- api ---- */
async function api(method,path,body){
  const r=await fetch(path,{method,credentials:'same-origin',
    headers:Object.assign({'X-OFD':'1'},body!==undefined?{'Content-Type':'application/json'}:{}),
    body:body!==undefined?JSON.stringify(body):undefined});
  let data=null;try{data=await r.json();}catch(e){}
  if(r.status===401&&path!=='/api/state'){PH='gate';await loadState();render();throw{status:401,data};}
  if(!r.ok)throw{status:r.status,data};
  return data;
}
const EMSG={BAD_LOGIN:'아이디 또는 비밀번호가 일치하지 않습니다.',BAD_CODE:'접속코드가 일치하지 않습니다.',
  RATE_LIMIT:'시도 횟수를 초과했습니다. 1분 후 다시 시도하십시오.',
  DOC_REQUIRED:'정보공개서·인근가맹점 현황문서 제공일이 기록되지 않았습니다.\n제공 전 가맹금 수령·계약 체결은 가맹사업법 제7조③ 위반입니다.',
  PW_FORMAT:'비밀번호는 4자 이상이어야 합니다.',USERNAME_FORMAT:'아이디는 영문 소문자·숫자 3~20자입니다.',
  USERNAME_TAKEN:'이미 사용 중인 아이디입니다.',LAST_MASTER:'마지막 활성 마스터 계정은 변경·삭제할 수 없습니다.',
  DEPT_FORMAT:'부서 값이 올바르지 않습니다.',FORBIDDEN:'이 작업에 대한 부서 권한이 없습니다.'};
const DEPTS={master:'마스터',admin:'관리',ops:'운영',sales:'영업'};
const CAPC={leads:['master','sales'],orders:['master','ops'],closings:['master','ops'],
  notices:['master','ops'],stores:['master','ops'],codes:['master','ops'],
  pos:['master','ops'],skus:['master','admin'],settle:['master','admin'],auditv:['master','admin'],
  users:['master'],backup:['master']};
const cap=c=>isHQ()&&CAPC[c]&&CAPC[c].includes(S.me.dept);
const emsg=e=>(e&&e.data&&EMSG[e.data.error])||'요청을 처리하지 못했습니다.';

/* ---- state ---- */
let PH='boot',ST0=null,S=null,tab='dash';
let pSel=null,salesDate=null,salesStore=null,setMonth=null,settle=null,settleLoading=false;
let anStore=null,anDays=30,anData=null,anLoading=false,posConf={loaded:false};
let repUnit='day',repFrom=null,repTo=null,repStores=null,repSkus=null,repMetric='amount',repData=null,repLoading=false;
let anOpen=new Set();
let stEdit=null;
let wasteData=null,wasteKey='';
let stSel=[],stGeo={},nvLoading=false,nvErr='',nvReady=false,nvKeyEdit=false;
function havM(a,b){const R=6371000,rad=x=>x*Math.PI/180;
  const dLa=rad(b.lat-a.lat),dLo=rad(b.lng-a.lng);
  const h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(h));}
function stDistText(){
  if(stSel.length!==2)return '아래 매장 칩 또는 지도 마커를 2곳 선택하면 직선거리가 표시됩니다.';
  const A=store(stSel[0]),B=store(stSel[1]);
  const a=stGeo[stSel[0]],b=stGeo[stSel[1]];
  if(!A||!B)return '';
  if(!a||!b||a.err||b.err)return A.name+' ↔ '+B.name+' — 좌표 확인 중… (주소가 지오코딩되지 않으면 소재지를 확인하십시오)';
  const d=havM(a,b);
  return A.name+' ↔ '+B.name+' 직선거리 '+(d<1000?Math.round(d).toLocaleString()+'m':(d/1000).toFixed(2)+'km ('+Math.round(d).toLocaleString('ko-KR')+'m)');}
function stToggle(id){const i=stSel.indexOf(id);
  if(i>=0)stSel.splice(i,1);
  else{if(stSel.length>=2)stSel=[];stSel.push(id);}
  render();}
function nvShowErr(msg){
  nvErr=msg;const e2=document.getElementById('nvmap');
  if(e2)e2.innerHTML='<div style="padding:20px;font-size:12.5px;line-height:1.7;color:var(--risk);font-weight:700">'+msg+'</div>';}
window.navermap_authFailure=function(){
  nvShowErr('네이버 지도 인증 실패 (authFailure)<br><span style="color:var(--dim);font-weight:400">'
    +'다음을 확인하십시오:<br>'
    +'① NCP 콘솔 Maps → Application → 해당 앱 → <b>Web 서비스 URL</b>에 <b>https://ofd-workstation.onrender.com</b> 이 [+추가]까지 눌러 등록되어 있는지<br>'
    +'② 입력한 값이 <b>Client ID</b>가 맞는지 (Client Secret 아님)<br>'
    +'③ Application 수정 화면에서 <b>Dynamic Map</b>이 체크되어 있는지<br>'
    +'수정 후 아래 [키 변경]으로 다시 저장하거나 페이지를 새로고침하십시오.</span>');};
function initNaverMap(){
  if(!S||!S.mapKey)return;
  const el=document.getElementById('nvmap');if(!el)return;
  if(nvErr){nvShowErr(nvErr);return;}
  if(!window.naver||!window.naver.maps||!window.naver.maps.Map){
    if(nvLoading)return;nvLoading=true;
    el.innerHTML='<div style="padding:20px;color:var(--dim);font-size:12px">네이버 지도 불러오는 중…</div>';
    const sc=document.createElement('script');
    sc.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(S.mapKey)+'&submodules=geocoder';
    sc.onload=()=>{nvLoading=false;
      setTimeout(()=>{if(!window.naver||!window.naver.maps||!window.naver.maps.Map){
        nvShowErr('지도 스크립트는 받았으나 초기화되지 않았습니다 — 인증 실패일 가능성이 높습니다. Web 서비스 URL 등록과 Client ID를 확인하십시오.');return;}
        nvReady=true;initNaverMap();},120);};
    sc.onerror=()=>{nvLoading=false;
      nvShowErr('네이버 지도 스크립트를 불러오지 못했습니다 (네트워크 차단 또는 잘못된 Client ID). 사내망·확장프로그램 차단 여부와 키를 확인하십시오.');};
    document.head.appendChild(sc);return;}
  S.stores.forEach(st=>{
    if(stGeo[st.id]||stGeo['_p'+st.id]||!st.addr)return;
    stGeo['_p'+st.id]=1;
    try{
      naver.maps.Service.geocode({query:st.addr},(status,res)=>{
        delete stGeo['_p'+st.id];
        if(status===naver.maps.Service.Status.OK&&res.v2&&res.v2.addresses&&res.v2.addresses[0]){
          const a=res.v2.addresses[0];stGeo[st.id]={lat:+a.y,lng:+a.x};}
        else stGeo[st.id]={err:1,msg:'주소 변환 실패'};
        if(tab==='stores')render();});
    }catch(e){delete stGeo['_p'+st.id];stGeo[st.id]={err:1,msg:'Geocoding 미사용 설정'};}});
  const pts=S.stores.map(st=>({st,g:stGeo[st.id]})).filter(x=>x.g&&!x.g.err);
  const c=pts.length?{lat:pts.reduce((s2,x)=>s2+x.g.lat,0)/pts.length,lng:pts.reduce((s2,x)=>s2+x.g.lng,0)/pts.length}:{lat:37.5449,lng:127.0559};
  let map;
  try{map=new naver.maps.Map(el,{center:new naver.maps.LatLng(c.lat,c.lng),zoom:pts.length?12:11});}
  catch(e){nvShowErr('지도 생성 실패: '+(e&&e.message?e.message:e));return;}
  const bounds=pts.length>1?new naver.maps.LatLngBounds():null;
  pts.forEach(({st,g})=>{
    const pos=new naver.maps.LatLng(g.lat,g.lng);
    const sel=stSel.includes(st.id);
    const mk=new naver.maps.Marker({map,position:pos,title:st.name,
      icon:{content:'<div style="background:'+(sel?'#D96D2B':'#2E2A25')+';color:#fff;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap">'+st.name+'</div>',anchor:new naver.maps.Point(30,14)}});
    naver.maps.Event.addListener(mk,'click',()=>stToggle(st.id));
    if(bounds)bounds.extend(pos);});
  if(bounds)map.fitBounds(bounds,{top:60,right:60,bottom:60,left:60});
  if(stSel.length===2){
    const a=stGeo[stSel[0]],b=stGeo[stSel[1]];
    if(a&&b&&!a.err&&!b.err)
      new naver.maps.Polyline({map,path:[new naver.maps.LatLng(a.lat,a.lng),new naver.maps.LatLng(b.lat,b.lng)],
        strokeColor:'#D96D2B',strokeWeight:3,strokeStyle:'shortdash'});}}
function stCsv(){
  const rows=[['매장명','구분','지역','소재지','전화','오픈일']]
    .concat(S.stores.map(s=>[s.name,s.type,s.region||'',s.addr||'',s.phone||'',s.openDate||'']));
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='OFD_매장정보_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);}
let prodConf={loaded:false},prodCat='전체',prodScope='전체',prodPriceOpen=new Set(),prodPromo=-1,prodStoreSel=null;
const CATS=['도넛','링도넛','음료','굿즈','서비스','세트','기타'];
let csv={raw:'',rows:null,head:null,map:null,preview:null};
let reveal=null; /* {name, code} 1회 노출 */
let setupCodes=null;

const today=()=>S&&S.today?S.today:new Date().toISOString().slice(0,10);
const isHQ=()=>S&&S.me.role==='hq';
const sku=id=>S.skus.find(k=>k.id===id);
const store=id=>S.stores.find(s=>s.id===id);
function gate(L){if(!L.docDate)return{has:false};
  const days=L.advisor?7:14,g=addD(L.docDate,days),left=diffD(today(),g);
  return{has:true,days,gate:g,ok:left<=0,left};}
const orderAmt=o=>o.items.reduce((a,i)=>{const k=sku(i.skuId);return a+(k?k.supply*i.qty:0);},0);
const closingRev=c=>c.items.reduce((a,i)=>{const k=sku(i.skuId);return a+(k?k.price*i.sold:0);},0);
function closingLoss(c){const s=c.items.reduce((a,i)=>a+i.sold,0),w=c.items.reduce((a,i)=>a+i.waste,0);
  return{sold:s,waste:w,rate:s+w>0?(w/(s+w)*100):0};}
function recQty(storeId,skuId,target){
  const cs=(S.sales||[]).filter(c=>c.storeId===storeId).sort((a,b)=>b.date<a.date?-1:1);
  const wk=isWknd(target);
  let pool=cs.filter(c=>isWknd(c.date)===wk).slice(0,5),basis=wk?'주말':'평일';
  if(pool.length<3){pool=cs.slice(0,7);basis='전체';}
  if(!pool.length)return{rec:0,basis:'-',n:0};
  const avg=pool.reduce((a,c)=>{const it=c.items.find(i=>i.skuId===skuId);return a+(it?it.sold:0);},0)/pool.length;
  const v=Math.round(avg*110)/100;
  return{rec:Math.ceil(v/5)*5,basis,n:pool.length};}
function revByDate(storeId){const out=[];
  for(let n=13;n>=0;n--){const d=addD(today(),-n);
    out.push({d,rev:(S.sales||[]).filter(c=>c.date===d&&(!storeId||c.storeId===storeId))
      .reduce((a,c)=>a+closingRev(c),0)});}
  return out;}

    :`<div class="g" style="color:var(--warn)">숙려 D-${g.left} · 계약가능 ${md(g.gate)} (+${g.days}일)</div>`;
}

      ${W.hasOrder?`<div class="kpis">

      ${W.items.map(x=>`<tr><td style="font-weight:700">${esc(x.name)}${x.over?` <span class="pill pl-warn" style="background:var(--warnsoft);color:var(--warn)">판매 초과 ${x.over}</span>`:''}</td>

    </div>`;})()}
  <div class="panel">
    <div class="row">
      ${hq?`<div><label>매장</label><select id="sl_store">${S.stores.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`:''}
      <div><label>마감 일자</label><input type="date" id="sl_date" value="${salesDate}"></div>
    </div>
    <div style="font-size:11px;color:var(--dim);font-weight:700;margin-bottom:6px">수기 입력 (POS 미연동 매장 · 예외 보정용) — 저장 시 자동 산출값을 덮어씁니다</div>

    ${S.skus.map(k=>{const it=ex?ex.items.find(i=>i.skuId===k.id):null;

      <td class="num" style="color:var(--dim)">${won(k.price)}</td>
      <td class="num"><input class="qty" type="number" min="0" id="sd_${k.id}" value="${it?it.sold:''}" placeholder="0"></td>
      <td class="num"><input class="qty" type="number" min="0" id="wt_${k.id}" value="${it?it.waste:''}" placeholder="0"></td></tr>`;}).join('')}

  </div>

  <div class="panel"><div class="panel-h"><h2>POS 데이터 가져오기 (CSV)</h2><span class="meta">토스 등 POS 내보내기 파일</span></div>
    <div class="row">
      <div style="flex:2"><label>CSV 붙여넣기 (쉼표/탭 구분, 첫 줄 헤더)</label>
        <textarea id="cs_raw" placeholder="일자,품목,수량&#10;2026-07-31,우유크림도넛,40">${esc(csv.raw)}</textarea></div>
      <div style="flex:0 0 170px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end">

    <div class="row">
      <div><label>일자 열</label><select id="cs_d">${csv.head.map((h,i)=>`<option value="${i}" ${csv.map.d===i?'selected':''}>${esc(h)}</option>`).join('')}</select></div>
      <div><label>품목 열</label><select id="cs_n">${csv.head.map((h,i)=>`<option value="${i}" ${csv.map.n===i?'selected':''}>${esc(h)}</option>`).join('')}</select></div>
      <div><label>판매수량 열</label><select id="cs_q">${csv.head.map((h,i)=>`<option value="${i}" ${csv.map.q===i?'selected':''}>${esc(h)}</option>`).join('')}</select></div>

    <div class="note">같은 일자·품목 행은 합산됩니다. 기존 마감이 있으면 판매수량은 CSV 값으로 대체되고 폐기수량은 유지됩니다(서버 검증).</div>

    ${hist.map(c=>{const L=closingLoss(c);

}

function vSettle(){
  if(!settle||settle.month!==setMonth){
    if(!settleLoading){settleLoading=true;
      api('GET','/api/settle?month='+encodeURIComponent(setMonth))
        .then(r=>{settle=r;settleLoading=false;render();})
        .catch(()=>{settleLoading=false;});}
    return `<div class="head"><div><h1>정산 (본사)</h1></div>
      <div><input type="month" id="st_month" value="${setMonth}" style="width:150px"></div></div>
      <div class="empty">집계 중…</div>`;
  }
  const rows=settle.rows;
  const tot=rows.reduce((a,r)=>({sup:a.sup+r.supply,rev:a.rev+r.revenue}),{sup:0,rev:0});
  return `
  <div class="head"><div><h1>정산 (본사)</h1>
    <p>공급 매출 = 출고·완료 발주의 공급가 합계 — 제3조②4호에 따라 밀집(을)에 귀속되는 생산·물류 수익의 기초 수치</p></div>
    <div><input type="month" id="st_month" value="${setMonth}" style="width:150px"></div></div>
  <div class="panel">
    <table><thead><tr><th>매장</th><th>구분</th><th class="num">공급 매출(밀집)</th><th class="num">매장 매출</th><th class="num">공급/매출</th><th class="num">로스율</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td style="font-weight:700">${esc(r.name)}</td>
      <td><span class="pill ${r.type==='직영'?'pl-info':'pl-sig'}">${esc(r.type)}</span></td>
      <td class="num" style="font-weight:700">${won(r.supply)}원</td>
      <td class="num">${won(r.revenue)}원</td>
      <td class="num" style="color:var(--dim)">${r.revenue>0?(r.supply/r.revenue*100).toFixed(1):'0.0'}%</td>
      <td class="num" style="color:${r.lossRate>=8?'var(--risk)':r.lossRate>=4?'var(--warn)':'var(--ok)'}">${r.lossRate.toFixed(1)}%</td></tr>`).join('')}
    <tr><td style="font-weight:800">합계</td><td></td>
      <td class="num" style="font-weight:800;color:var(--deep)">${won(tot.sup)}원</td>
      <td class="num" style="font-weight:800">${won(tot.rev)}원</td><td></td><td></td></tr>
    </tbody></table>
    <div class="note">로열티 정산 모듈은 제4조 자료(기존 가맹계약서·로열티 산정기준) 수령 후 요율 반영해 추가합니다. r9(22 vs 26) 해소 전 매장별 귀속 구분을 확정하지 마십시오.</div>
  </div>`;
}

function vAn(){
  const hq=isHQ();
  if(hq&&!anStore)anStore=S.stores[0]?S.stores[0].id:null;
  const sid=hq?anStore:S.me.storeId;
  if(!sid)return '<div class="empty">매장이 없습니다.</div>';
  const to=today(), from=addD(to,-(anDays-1));
  const head=`
  <div class="head"><div><h1>매출 분석${hq?'':' — '+esc((store(sid)||{}).name||'')}</h1>
    <p>${from} ~ ${to} · 토스플레이스 실측(POS) 우선, 미연동 시 마감×정가 기준</p></div>
    <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      ${hq?`<div style="min-width:150px"><label>매장</label><select id="an_store">${S.stores.map(st=>`<option value="${st.id}" ${st.id===sid?'selected':''}>${esc(st.name)}</option>`).join('')}</select></div>`:''}
      <div style="display:flex;gap:5px">${[7,30,90].map(d=>`<button class="btn ${anDays===d?'':'ghost '}sm" data-anp="${d}">${d}일</button>`).join('')}</div>
    </div></div>`;
  if(!anData||anData.storeId!==sid||anData.from!==from||anData.to!==to){
    if(!anLoading){anLoading=true;
      api('GET','/api/analytics?storeId='+encodeURIComponent(sid)+'&from='+from+'&to='+to)
        .then(r=>{anData=r;anOpen=new Set();anLoading=false;render();})
        .catch(()=>{anLoading=false;anData={storeId:sid,from,to,err:true};render();});}
    return head+'<div class="empty">분석 계산 중…</div>';
  }
  const A=anData;
  if(A.err)return head+'<div class="empty">분석 데이터를 불러오지 못했습니다.</div>';
  const g=A.growthPct;
  const mxD=Math.max(...A.daily.map(d=>d.amount),1);
  const showEvery=A.daily.length>31?7:(A.daily.length>10?2:1);
  const hourSlice=A.hourly?A.hourly.filter(h=>h.hour>=8&&h.hour<=22):null;
  const mxH=hourSlice?Math.max(...hourSlice.map(h=>h.amount),1):1;
  return head+`
  <div class="kpis">
    <div class="kpi"><div class="k">기간 매출 <span class="pill ${A.source==='pos'?'pl-ok':'pl-dim'}" style="margin-left:4px">${A.source==='pos'?'POS 실측':'마감 기반'}</span></div>
      <div class="v">${won(A.totalAmount)}<em>원</em></div><div class="s">판매 ${won(A.totalQty)}개</div></div>
    <div class="kpi"><div class="k">전기간 대비 (${A.days}일)</div>
      <div class="v" style="color:${g==null?'var(--dimmer)':g>=0?'var(--ok)':'var(--risk)'}">${g==null?'—':(g>=0?'+':'')+g.toFixed(1)+'%'}</div>
      <div class="s">직전 ${A.days}일 ${won(A.prevAmount)}원</div></div>
    <div class="kpi"><div class="k">주중 일평균</div><div class="v">${won(A.weekdayAvg)}<em>원</em></div><div class="s">주말 대비 ${A.weekendAvg>0?(A.weekdayAvg/A.weekendAvg*100).toFixed(0)+'%':'—'}</div></div>
    <div class="kpi"><div class="k">주말 일평균</div><div class="v" style="color:var(--deep)">${won(A.weekendAvg)}<em>원</em></div><div class="s">WEEKEND BURST 기준선</div></div>
    ${A.unmatchedAmount>0?`<div class="kpi"><div class="k">미매칭 매출</div><div class="v" style="color:var(--warn)">${won(A.unmatchedAmount)}<em>원</em></div><div class="s">설정 → POS 연동에서 매핑</div></div>`:''}
  </div>
  <div class="panel"><div class="panel-h"><h2>일별 매출</h2><span class="meta">${A.from} ~ ${A.to}</span></div>
    <div class="bars">${A.daily.map((d,i)=>`<div class="b"><i style="height:${Math.round(d.amount/mxD*88)}px;${d.wknd?'background:var(--deep)':''}"></i><span>${i%showEvery===0?d.date.slice(8):''}</span></div>`).join('')}</div>
    <div style="font-size:10px;color:var(--dimmer);margin-top:4px">진한 막대 = 주말</div></div>
  ${hourSlice?`<div class="panel"><div class="panel-h"><h2>시간대별 매출 (08~22시)</h2><span class="meta">피크 운영·생산 타이밍 근거</span></div>
    <div class="bars">${hourSlice.map(h=>`<div class="b"><i style="height:${Math.round(h.amount/mxH*88)}px"></i><span>${h.hour}시</span></div>`).join('')}</div></div>`:''}
  <div class="panel"><div class="panel-h"><h2>상품 믹스</h2><span class="meta">매출 비중 — P&L 모델 믹스 가정 검증용</span></div>
    <table><thead><tr><th>품목</th><th class="num">수량</th><th class="num">매출</th><th style="width:40%">비중</th></tr></thead><tbody>
    ${A.mix.map((x2,mi)=>{const mk='m'+mi;const hasNm=x2.names&&x2.names.length>0;const open=anOpen.has(mk);
      return `<tr ${hasNm?`data-mixk="${mk}" style="cursor:pointer"`:''}><td style="font-weight:700">${hasNm?`<span style="color:var(--dim);font-size:10px">${open?'▾':'▸'}</span> `:''}${esc(x2.name)} ${x2.matched?'':'<span class="pill pl-warn" style="background:var(--warnsoft);color:var(--warn)">미매칭</span>'}${hasNm&&x2.names.length>1?` <span class="pill pl-dim">${x2.names.length}개 통합</span>`:''}</td>
      <td class="num">${won(x2.qty)}</td><td class="num">${won(x2.amount)}원</td>
      <td><div style="display:flex;align-items:center;gap:7px"><div style="flex:1;background:#F1EDE5;border-radius:4px;height:9px;overflow:hidden"><div style="width:${Math.min(100,x2.share).toFixed(1)}%;height:100%;background:${x2.matched?'var(--sig)':'var(--warn)'}"></div></div><span style="font-size:11px;color:var(--dim);min-width:44px;text-align:right">${x2.share.toFixed(1)}%</span></div></td></tr>`
      +(open&&hasNm?x2.names.map(nm=>`<tr style="background:#FAF7F1"><td style="padding-left:26px;font-size:12px;color:var(--dim)">└ ${esc(nm.name)}</td>
        <td class="num" style="font-size:12px;color:var(--dim)">${won(nm.qty)}</td>
        <td class="num" style="font-size:12px;color:var(--dim)">${won(nm.amount)}원</td><td></td></tr>`).join(''):'');}).join('')}
    </tbody></table></div>`;
}

    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <span style="font-size:11px;font-weight:800;color:var(--dim);min-width:34px">매장</span>
      <button class="btn ghost sm" data-repallst="1">전체</button>
      ${S.stores.map(st=>`<button class="btn ${repStores.has(st.id)?'':'ghost '}sm" data-repst="${st.id}">${esc(st.name)}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span style="font-size:11px;font-weight:800;color:var(--dim);min-width:34px">품목</span>
      <button class="btn ghost sm" data-repallsk="1">전체</button>
      ${S.skus.map(k=>`<button class="btn ${repSkus.has(k.id)?'':'ghost '}sm" data-repsk="${k.id}">${esc(k.name)}</button>`).join('')}
      <button class="btn ${repSkus.has('__unmatched')?'':'ghost '}sm" data-repsk="__unmatched">미매칭(기타)</button>
    </div>
  </div>`;
  if(!repData||repData._key!==key){
    if(!repLoading){repLoading=true;
      const q='/api/salesreport?from='+repFrom+'&to='+repTo+'&unit='+repUnit
        +'&stores='+encodeURIComponent([...repStores].join(','))
        +(allSku?'':'&skus='+encodeURIComponent([...repSkus].join(',')));
      api('GET',q).then(r=>{r._key=key;repData=r;repLoading=false;render();})
        .catch(()=>{repLoading=false;repData={_key:key,err:true};render();});}
    return head+'<div class="empty">집계 중…</div>';
  }
  const D=repData;
  if(D.err)return head+'<div class="empty">집계에 실패했습니다.</div>';
  const M=repMetric, unitLbl=M==='amount'?'원':'개';
  const cell=v=>v?won(v[M]):'<span style="color:var(--dimmer)">–</span>';
  return head+`
  <div class="kpis">
    <div class="kpi"><div class="k">기간 합계 (${unitLbl==='원'?'매출':'수량'})</div><div class="v">${won(D.grand[M])}<em>${unitLbl}</em></div><div class="s">${D.unit==='day'?'일별':D.unit==='week'?'주별':'월별'} · ${D.rows.length}개 구간</div></div>
    <div class="kpi"><div class="k">선택 매장</div><div class="v">${D.stores.length}<em>곳</em></div><div class="s">POS ${D.stores.filter(s=>s.source==='pos').length} · 마감 ${D.stores.filter(s=>s.source==='closings').length}</div></div>
    <div class="kpi"><div class="k">구간 평균</div><div class="v">${won(D.rows.length?Math.round(D.grand[M]/D.rows.length):0)}<em>${unitLbl}</em></div><div class="s">데이터 있는 구간 기준</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h2>기간 × 매장</h2><span class="meta">단위: ${unitLbl}</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>기간</th>
      ${D.stores.map(s=>`<th class="num">${esc(s.name)}<div style="font-weight:400;font-size:9.5px;color:var(--dimmer)">${s.source==='pos'?'POS 실측':s.source==='closings'?'마감 기준':'-'}</div></th>`).join('')}
      <th class="num" style="border-left:2px solid var(--line)">합계</th></tr></thead><tbody>
    ${D.rows.length?D.rows.map(r=>`<tr><td style="font-weight:700;white-space:nowrap">${esc(r.label)}</td>
      ${D.stores.map(s=>`<td class="num">${cell(r.perStore[s.storeId])}</td>`).join('')}
      <td class="num" style="font-weight:800;border-left:2px solid var(--line)">${won(r.total[M])}</td></tr>`).join('')
      :`<tr><td colspan="${D.stores.length+2}" style="text-align:center;color:var(--dimmer);padding:20px">선택한 조건에 데이터가 없습니다</td></tr>`}
    </tbody>${D.rows.length?`<tfoot><tr style="background:#F4F0E8"><td style="font-weight:800">합계</td>
      ${D.stores.map(s=>`<td class="num" style="font-weight:800">${cell(D.perStoreTotal[s.storeId])}</td>`).join('')}
      <td class="num" style="font-weight:800;border-left:2px solid var(--line)">${won(D.grand[M])}</td></tr></tfoot>`:''}
    </table></div></div>`;
}

function priceInfoOf(skuId){return (prodConf.prices&&prodConf.prices.items||[]).find(x=>x.skuId===skuId)||null;}
function vProd(){
  if(!prodConf.loaded){

      Promise.all([api('GET','/api/pos/unmatched'),api('GET','/api/pos/aliases'),api('GET','/api/products/prices?days=30')])
        .then(([a,b2,c2])=>{prodConf={loaded:true,unmatched:a.items,aliases:b2.aliases||[],prices:c2};render();})
        .catch(()=>{prodConf={loaded:true,unmatched:[],aliases:[],prices:{items:[]}};render();});}
    return '<div class="head"><div><h1>상품 관리</h1></div></div><div class="empty">상품 데이터 불러오는 중…</div>';}
  if(!prodStoreSel&&S.stores.length)prodStoreSel=S.stores[0].id;
  const stName=id=>{const st=store(id);return st?st.name:id;};
  let list=S.skus.slice();
  if(prodCat!=='전체')list=list.filter(k=>(k.category||'기타')===prodCat);
  if(prodScope==='본사')list=list.filter(k=>!k.storeId);
  else if(prodScope!=='전체')list=list.filter(k=>k.storeId===prodScope);
  const flagPill=pi=>{
    if(!pi||!pi.flag)return '';
    const t=pi.flag==='high'?'↑ 매장가 높음':pi.flag==='low'?'↓ 매장가 낮음':'± 매장가 상이';
    const c=pi.flag==='high'?'var(--risk)':pi.flag==='low'?'var(--info)':'var(--warn)';
    return `<span class="pill" style="background:transparent;border:1px solid ${c};color:${c}">${t} ${pi.maxAbs.toFixed(1)}%</span>`;};
  return `
  <div class="head"><div><h1>상품 관리</h1><p>판매 SKU · 카테고리 · 매장 전용 상품 · 실판매가 편차(최근 ${prodConf.prices.days||30}일 POS 실측 vs 기준가, ±2% 이상 표기)</p></div></div>

      <button class="btn ${prodScope==='전체'?'':'ghost '}sm" data-pscope="전체">전체</button>
      <button class="btn ${prodScope==='본사'?'':'ghost '}sm" data-pscope="본사">본사 공통</button>
      ${S.stores.map(st=>`<button class="btn ${prodScope===st.id?'':'ghost '}sm" data-pscope="${st.id}">${esc(st.name)} 전용</button>`).join('')}
    </div>

    ${list.length?list.map(k=>{
      const pi=priceInfoOf(k.id);const open=prodPriceOpen.has(k.id);const clickable=!!(pi&&pi.stores.length>0);
      return `<tr ${clickable?`data-prow="${k.id}" style="cursor:pointer"`:''}>

        <td class="num">${won(k.price)}</td><td class="num">${won(k.supply)}</td>
        <td class="num" style="color:var(--dim)">${k.price?(k.supply/k.price*100).toFixed(1):'-'}%</td>
        <td>${flagPill(pi)}</td>

    }).join(''):`<tr><td colspan="8" style="text-align:center;color:var(--dimmer);padding:18px">조건에 맞는 SKU가 없습니다</td></tr>`}

    ${(()=>{const sid=prodStoreSel;const rows=[];
      S.skus.forEach(k=>{
        if(k.storeId&&k.storeId!==sid)return;
        const pi=priceInfoOf(k.id);const sr=pi?pi.stores.find(x=>x.storeId===sid):null;
        if(!sr&&!k.storeId)return;

      return rows.length?rows.sort((a,b)=>(b.sr?b.sr.amount:0)-(a.sr?a.sr.amount:0)).map(({k,sr})=>`<tr>
        <td style="font-weight:700">${esc(k.name)}${k.storeId?' <span class="pill pl-dim">전용</span>':''}</td>

  </div>`;
}

/* ---- csv (클라이언트 파싱 → 서버 검증 반영) ---- */
function parseCsvText(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(lines.length<2)return null;
  const dl=[',','\t',';'].map(d=>({d,n:lines[0].split(d).length})).sort((a,b)=>b.n-a.n)[0].d;
  const splitLine=l=>{const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
      else{if(ch==='"')q=true;else if(ch===dl){out.push(cur);cur='';}else cur+=ch;}}
    out.push(cur);return out.map(s=>s.trim());};
  const head=splitLine(lines[0]);
  const rows=lines.slice(1).map(splitLine);
  const guess=(names)=>{const i=head.findIndex(h=>names.some(n=>h.replace(/\s/g,'').toLowerCase().includes(n)));return i>=0?i:0;};
  return{head,rows,map:{d:guess(['일자','날짜','date']),n:guess(['품목','메뉴','상품','item','name']),q:guess(['수량','판매','qty','count'])}};
}
function normDate(s){
  let x=s.replace(/[./]/g,'-').trim();
  if(/^\d{8}$/.test(x))x=x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6);
  const m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  const m2=x.match(/^(\d{1,2})-(\d{1,2})$/);
  if(m2)return today().slice(0,4)+'-'+pad(+m2[1])+'-'+pad(+m2[2]);
  return null;
}
function buildPreview(){
  const{rows,map}=csv;
  const norm=s=>s.replace(/\s/g,'');
  const byName={};S.skus.forEach(k=>byName[norm(k.name)]=k.id);
  const agg={};const missSet=new Set();let cnt=0;
  rows.forEach(r=>{
    const d=normDate(r[map.d]||'');const nm=norm(r[map.n]||'');const q=+String(r[map.q]||'').replace(/[^\d.-]/g,'');
    if(!d||!nm||!(q>0))return;
    cnt++;
    const kid=byName[nm];
    if(!kid){missSet.add(r[map.n]);return;}
    agg[d]=agg[d]||{};agg[d][kid]=(agg[d][kid]||0)+q;});
  csv.preview={agg,days:Object.keys(agg).length,rows:cnt,
    ok:new Set(Object.values(agg).flatMap(o=>Object.keys(o))).size,miss:[...missSet]};
}

      if(e.data&&e.data.error==='NOT_SOLD_AT_STORE')alert('이 품목은 '+e.data.store+'에서 판매 이력이 없어 그 매장 전용 SKU로는 매핑할 수 없습니다.');
      else alert(emsg(e));}});
}

/* ---- boot ---- */
(async function boot(){
  try{
    await loadState();
    if(ST0.setup){PH='setup';render();return;}
    if(ST0.authed){PH='app';await refresh();render();return;}
    PH='gate';render();
  }catch(e){
    $.innerHTML='<div class="boot">서버에 연결할 수 없습니다. 서버 가동 상태를 확인하십시오.</div>';
  }
})();
})();
</script>
