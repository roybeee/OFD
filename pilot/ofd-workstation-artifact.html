<script>
(function(){
const KDB='ofd_erp_db_v2', KSES='ofd_erp_session', KV1='ofd_erp_state';
const $=document.getElementById('app');
const STAGES=['\uB9AC\uB4DC','\uC0C1\uB2F4','\uC815\uBCF4\uACF5\uAC1C\uC11C \uC81C\uACF5','\uAC00\uB9F9\uACC4\uC57D','\uC2E4\uC0AC\u00B7\uACF5\uC0AC','\uC624\uD508\uC644\uB8CC'];
const OSTAT=['\uB300\uAE30','\uC2B9\uC778','\uC785\uAE08\uD655\uC778','\uCD9C\uACE0','\uC644\uB8CC'];
const OSCLS={'\uB300\uAE30':'pl-wait','\uC2B9\uC778':'pl-info','\uC785\uAE08\uD655\uC778':'pl-sig','\uCD9C\uACE0':'pl-info','\uC644\uB8CC':'pl-ok'};

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const diffD=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const isWknd=s=>{const w=new Date(s+'T00:00:00').getDay();return w===0||w===6;};
const md=s=>s?s.slice(5).replace('-','.'):'';
const won=n=>n.toLocaleString('ko-KR');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function hashPin(s){
  const msg='ofd:'+s;
  try{
    if(typeof crypto!=='undefined'&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
      return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381;for(let i=0;i<msg.length;i++)h=((h*33)^msg.charCodeAt(0+i))>>>0;
  return 'x'+h.toString(16);
}
const genCode=()=>String(Math.floor(100000+Math.random()*900000));

/* ---------- storage ---------- */
async function sget(k,shared){try{const r=await window.storage.get(k,shared);return r&&r.value?JSON.parse(r.value):null;}catch(e){return null;}}
async function sset(k,v,shared){try{await window.storage.set(k,JSON.stringify(v),shared);return true;}catch(e){console.error('storage set failed',k,e);return false;}}

/* ---------- db / sync ---------- */
let DB=null, SES=null, ph='boot', tab='dash';
let pSel=null, salesDate=today(), salesStore=null, setMonth=today().slice(0,7);
let csv={raw:'',rows:null,map:null,preview:null};
let saveT=null, syncing=false;

const COLS=['skus','stores','leads','orders','sales','notices','logs'];
function emptyDb(){return{rev:1,skus:[],stores:[],leads:[],orders:[],sales:[],notices:[],logs:[],
  sec:{pinH:'',codes:{},mt:1}};}
function mergeDb(a,b){ /* b wins on higher mt per entity; tombstones respected */
  if(!a)return b; if(!b)return a;
  const out=emptyDb();
  COLS.forEach(c=>{
    const m=new Map();
    (a[c]||[]).forEach(x=>m.set(x.id,x));
    (b[c]||[]).forEach(x=>{const p=m.get(x.id);
      if(!p||(x.mt||0)>=(p.mt||0))m.set(x.id,x);});
    out[c]=[...m.values()];
  });
  out.sec=((b.sec&&b.sec.mt||0)>=(a.sec&&a.sec.mt||0))?(b.sec||a.sec):(a.sec||b.sec);
  out.rev=Math.max(a.rev||1,b.rev||1)+1;
  return out;
}
const C=n=>DB[n].filter(x=>!x.del);
function up(n,obj){obj.mt=Date.now();
  const i=DB[n].findIndex(x=>x.id===obj.id);
  if(i>=0)DB[n][i]=obj;else DB[n].push(obj);
  save();}
function rm(n,id){const x=DB[n].find(y=>y.id===id);
  if(x){x.del=true;x.mt=Date.now();save();}}
function log(act){DB.logs.push({id:uid('g'),mt:Date.now(),who:SES?SES.label:'-',act});
  if(DB.logs.length>500)DB.logs=DB.logs.slice(-500);}

async function pushDb(){
  const remote=await sget(KDB,true);
  DB=mergeDb(remote,DB);
  const ok=await sset(KDB,DB,true);
  const el=$.querySelector('.save');
  if(ok&&el){el.textContent='\uB3D9\uAE30\uD654\uB428 rev '+DB.rev;el.classList.add('on');
    setTimeout(()=>el.classList.remove('on'),1300);}
}
function save(){clearTimeout(saveT);saveT=setTimeout(pushDb,400);}
async function pullDb(){
  if(syncing)return;syncing=true;
  const remote=await sget(KDB,true);
  if(remote){DB=mergeDb(DB,remote);}
  syncing=false;render();
}

/* ---------- seed / migrate ---------- */
function seedDb(withDemo){
  const db=emptyDb(),t=today(),M=1;
  db.skus=[['\uC6B0\uC720\uD06C\uB9BC\uB3C4\uB11B',4200,2016],['\uBC84\uD130\uD53C\uC2A4\uD0C0\uCE58\uC624',5800,2784],['\uD06C\uB9BC\uBE0C\uB944\uB808',4700,2256],
   ['\uC624\uB9AC\uC9C0\uB110',3000,1440],['\uC2DC\uB098\uBAAC\uC288\uAC00',3400,1632],['\uBCF4\uC2A4\uD134\uD06C\uB9BC',4900,2352],['\uD2F0\uB77C\uBBF8\uC218',5800,2784],
   ['\uD53C\uB11B\uBC84\uD130',5800,2784],['\uCD08\uCF54\uD06C\uB7F0\uCE58',3800,1824],['\uBA54\uC774\uD50C\uD53C\uCE78',5000,2400]]
   .map((x,i)=>({id:'k'+(i+1),mt:M,name:x[0],price:x[1],supply:x[2]}));
  db.stores=[
   {id:'s1',mt:M,name:'\uAC00\uB85C\uC218\uAE38\uC810',type:'\uC9C1\uC601',region:'\uC11C\uC6B8',addr:'\uAC15\uB0A8\uAD6C \uAC15\uB0A8\uB300\uB85C160\uAE38 35-5',phone:'0507-1339-2589',openDate:'2018-05-01'},
   {id:'s2',mt:M,name:'\uC815\uC790\uC810',type:'\uAC00\uB9F9',region:'\uACBD\uAE30',addr:'\uC131\uB0A8\uC2DC \uBD84\uB2F9\uAD6C \uC815\uC790\uC77C\uB85C 135',phone:'031-607-4137',openDate:'2021-03-01'},
   {id:'s3',mt:M,name:'\uC0AC\uB2F9\uC810',type:'\uAC00\uB9F9',region:'\uC11C\uC6B8',addr:'\uC11C\uCD08\uAD6C \uB3D9\uC791\uB300\uB85C 36',phone:'0507-1406-5061',openDate:'2022-06-01'}];
  if(withDemo){
    db.leads=[
     {id:'p1',mt:M,name:'\uAE40OO',phone:'010-1234-0001',area:'\uC218\uC6D0 \uAD11\uAD50',storeName:'\uAD11\uAD50\uC810(\uC608\uC815)',
      stage:2,docDate:addD(t,-6),advisor:false,openTarget:addD(t,45),
      memo:'(\uC608\uC2DC) \uAC24\uB7EC\uB9AC\uC544 \uAD11\uAD50 \uC778\uADFC 1\uCE35 30\uD3C9 \uD76C\uB9DD',flag:false,created:addD(t,-9)},
     {id:'p2',mt:M,name:'\uBC15OO',phone:'010-1234-0002',area:'\uC11C\uC6B8 \uB9C8\uACE1',storeName:'',
      stage:1,docDate:'',advisor:false,openTarget:'',memo:'(\uC608\uC2DC) \uC624\uD53C\uC2A4 \uC0C1\uAD8C \uBB38\uC758',flag:false,created:addD(t,-3)},
     {id:'p3',mt:M,name:'\uC774OO',phone:'010-1234-0003',area:'\uB3D9\uD0C4 \uC2E0\uB3C4\uC2DC',storeName:'\uB3D9\uD0C4\uC810(\uC608\uC815)',
      stage:4,docDate:addD(t,-40),advisor:true,openTarget:addD(t,20),memo:'(\uC608\uC2DC) \uC778\uD14C\uB9AC\uC5B4 \uCC29\uACF5',flag:false,created:addD(t,-55)}];
    db.orders=[{id:'o1',mt:M,storeId:'s2',date:addD(t,-1),items:[{skuId:'k1',qty:60},{skuId:'k2',qty:30}],status:'\uB300\uAE30',memo:'(\uC608\uC2DC)'}];
    db.sales=[
     {id:'c1',mt:M,storeId:'s2',date:addD(t,-3),items:[{skuId:'k1',sold:42,waste:1},{skuId:'k2',sold:22,waste:0}]},
     {id:'c2',mt:M,storeId:'s2',date:addD(t,-2),items:[{skuId:'k1',sold:35,waste:3},{skuId:'k2',sold:18,waste:1}]},
     {id:'c3',mt:M,storeId:'s2',date:addD(t,-1),items:[{skuId:'k1',sold:40,waste:2},{skuId:'k2',sold:20,waste:0}]}];
    db.notices=[{id:'n1',mt:M,date:t,pinned:true,title:'\uD504\uB79C\uCC28\uC774\uC988 \uC6CC\uD06C\uC2A4\uD14C\uC774\uC158 v2 \uC624\uD508',
      body:'\uBA40\uD2F0\uC720\uC800\u00B7POS \uAC00\uC838\uC624\uAE30\u00B7\uC815\uC0B0 \uC9D1\uACC4\uAC00 \uCD94\uAC00\uB418\uC5C8\uC2B5\uB2C8\uB2E4. \uC810\uC8FC \uC811\uC18D\uCF54\uB4DC\uB294 \uBCF8\uC0AC \uC124\uC815 \uD0ED\uC5D0\uC11C \uBC1C\uAE09\uD569\uB2C8\uB2E4.'}];
  }
  return db;
}
function migrateV1(v1){
  const db=emptyDb(),M=Date.now();
  ['skus','stores','leads','orders','sales','notices'].forEach(c=>{
    (v1[c]||[]).forEach(x=>{x.mt=M;db[c].push(x);});});
  return db;
}

/* ---------- domain ---------- */
const sku=id=>C('skus').find(k=>k.id===id);
const store=id=>C('stores').find(s=>s.id===id);
const isHQ=()=>SES&&SES.who==='hq';
const myStore=()=>isHQ()?null:store(SES.who);
function gate(L){if(!L.docDate)return{has:false};
  const days=L.advisor?7:14,g=addD(L.docDate,days),left=diffD(today(),g);
  return{has:true,days,gate:g,ok:left<=0,left};}
function orderAmt(o){return o.items.reduce((a,i)=>{const k=sku(i.skuId);return a+(k?k.supply*i.qty:0);},0);}
function closingRev(c){return c.items.reduce((a,i)=>{const k=sku(i.skuId);return a+(k?k.price*i.sold:0);},0);}
function closingLoss(c){const s=c.items.reduce((a,i)=>a+i.sold,0),w=c.items.reduce((a,i)=>a+i.waste,0);
  return{sold:s,waste:w,rate:s+w>0?(w/(s+w)*100):0};}
function recQty(storeId,skuId,target){
  const cs=C('sales').filter(c=>c.storeId===storeId).sort((a,b)=>b.date<a.date?-1:1);
  const wk=isWknd(target);
  let pool=cs.filter(c=>isWknd(c.date)===wk).slice(0,5);
  let basis=wk?'\uC8FC\uB9D0':'\uD3C9\uC77C';
  if(pool.length<3){pool=cs.slice(0,7);basis='\uC804\uCCB4';}
  if(!pool.length)return{rec:0,basis:'-',n:0};
  const tot=pool.reduce((a,c)=>{const it=c.items.find(i=>i.skuId===skuId);return a+(it?it.sold:0);},0);
  const avg=tot/pool.length;
  const v=Math.round(avg*110)/100; /* x1.1, \uBD80\uB3D9\uC18C\uC218\uC810 \uACBD\uACC4 \uBCF4\uC815 */
  return{rec:Math.ceil(v/5)*5,basis,n:pool.length};}
function revByDate(storeId){const out=[];
  for(let n=13;n>=0;n--){const d=addD(today(),-n);
    const rev=C('sales').filter(c=>c.date===d&&(!storeId||c.storeId===storeId))
      .reduce((a,c)=>a+closingRev(c),0);
    out.push({d,rev});}
  return out;}

/* ---------- render root ---------- */
function tabsFor(){return isHQ()
  ?[['dash','\uB300\uC2DC\uBCF4\uB4DC'],['pipe','\uC601\uC5C5'],['orders','\uBC1C\uC8FC'],['sales','\uB9E4\uCD9C'],['settle','\uC815\uC0B0'],['notice','\uACF5\uC9C0'],['stores','\uB9E4\uC7A5'],['conf','\uC124\uC815']]
  :[['dash','\uB300\uC2DC\uBCF4\uB4DC'],['orders','\uBC1C\uC8FC'],['sales','\uB9E4\uCD9C \uB9C8\uAC10'],['notice','\uACF5\uC9C0']];}
function render(){
  if(ph==='setup')return renderSetup();
  if(ph==='gate')return renderGate();
  const TB=tabsFor();
  if(!TB.find(x=>x[0]===tab))tab='dash';
  $.innerHTML=`
  <div class="top">
    <div class="logo"><div class="dot"></div>
      <div><b>OFD \uC6CC\uD06C\uC2A4\uD14C\uC774\uC158</b><br><span>FRANCHISE OPS v2</span></div></div>

  const go=$.querySelector('#su_go');

    const dates=[...new Set(C('sales').map(c=>c.date))].sort();
    const last=dates[dates.length-1];
    const lastRev=last?C('sales').filter(c=>c.date===last).reduce((a,c)=>a+closingRev(c),0):0;
    const bars=revByDate(null),mx=Math.max(...bars.map(b=>b.rev),1);
    return `
    <div class="head"><div><h1>\uBCF8\uC0AC \uB300\uC2DC\uBCF4\uB4DC</h1><p>${t} \uAE30\uC900 \u00B7 \uB9E4\uC7A5 ${C('stores').length}\uAC1C (\uC9C1\uC601 ${C('stores').filter(s=>s.type==='\uC9C1\uC601').length} \u00B7 \uAC00\uB9F9 ${C('stores').filter(s=>s.type==='\uAC00\uB9F9').length})</p></div></div>
    <div class="kpis">
      <div class="kpi"><div class="k">\uD65C\uC131 \uB9AC\uB4DC</div><div class="v">${act}<em>\uAC74</em></div><div class="s">\uD30C\uC774\uD504\uB77C\uC778 \uC9C4\uD589 \uC911</div></div>
      <div class="kpi"><div class="k">\uC219\uB824\uAE30\uAC04 \uC9C4\uD589</div><div class="v" style="color:${cool?'var(--warn)':'var(--ink)'}">${cool}<em>\uAC74</em></div><div class="s">\uACC4\uC57D \uB300\uAE30 (\uC81C7\uC870\u2462)</div></div>
      <div class="kpi"><div class="k">\uBC1C\uC8FC \uC2B9\uC778 \uB300\uAE30</div><div class="v" style="color:${pend?'var(--sig)':'var(--ink)'}">${pend}<em>\uAC74</em></div><div class="s">\uBC1C\uC8FC \uD0ED\uC5D0\uC11C \uCC98\uB9AC</div></div>
      <div class="kpi"><div class="k">\uC774\uBC88 \uB2EC \uC624\uD508</div><div class="v">${opened}<em>\uAC1C\uC810</em></div><div class="s">${t.slice(0,7)}</div></div>
      <div class="kpi"><div class="k">\uCD5C\uADFC \uB9C8\uAC10 \uB9E4\uCD9C</div><div class="v">${won(lastRev)}<em>\uC6D0</em></div><div class="s">${last?last+' \uC804 \uB9E4\uC7A5':'\uAE30\uB85D \uC5C6\uC74C'}</div></div>
    </div>
    <div class="panel"><div class="panel-h"><h2>\uC601\uC5C5 \uD37C\uB110</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${STAGES.map((st,i)=>{const n=C('leads').filter(L=>L.stage===i).length;
        return `<div style="flex:1;min-width:90px;background:#F4F0E8;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center">
        <div style="font-size:10px;color:var(--dim);font-weight:700">${st}</div>
        <div style="font-size:20px;font-weight:800;margin-top:4px;color:${n?'var(--ink)':'var(--dimmer)'}">${n}</div></div>`;}).join('')}</div></div>
    <div class="panel"><div class="panel-h"><h2>\uCD5C\uADFC 14\uC77C \uB9E4\uCD9C (\uC804 \uB9E4\uC7A5)</h2></div>
      <div class="bars">${bars.map(b=>`<div class="b"><i style="height:${Math.round(b.rev/mx*88)}px"></i><span>${b.d.slice(8)}</span></div>`).join('')}</div></div>
    ${noticeList(3)}`;
  }
  const st=myStore();
  if(!st){return '<div class="empty">\uB9E4\uC7A5 \uC815\uBCF4\uB97C \uCC3E\uC744 \uC218 \uC5C6\uC2B5\uB2C8\uB2E4. \uC138\uC158\uC744 \uC804\uD658\uD558\uC2ED\uC2DC\uC624.</div>';}
  const mine=C('sales').filter(c=>c.storeId===st.id).sort((a,b)=>b.date<a.date?-1:1);
  const lastC=mine[0];
  const myOrd=C('orders').filter(o=>o.storeId===st.id&&o.status!=='\uC644\uB8CC');
  const bars=revByDate(st.id),mx=Math.max(...bars.map(b=>b.rev),1);
  return `
  <div class="head"><div><h1>${esc(st.name)} \uB300\uC2DC\uBCF4\uB4DC</h1><p>${esc(st.type)} \u00B7 ${esc(st.region)} \u00B7 \uC624\uD508 ${st.openDate||'-'}</p></div></div>

    <div class="kpi"><div class="k">\uC9C4\uD589 \uC911 \uBC1C\uC8FC</div><div class="v">${myOrd.length}<em>\uAC74</em></div><div class="s">${myOrd.length?myOrd.map(o=>o.status).join(' \u00B7 '):'\uC5C6\uC74C'}</div></div>
  </div>
  <div class="panel"><div class="panel-h"><h2>\uCD5C\uADFC 14\uC77C \uB9E4\uCD9C</h2></div>
    <div class="bars">${bars.map(b=>`<div class="b"><i style="height:${Math.round(b.rev/mx*88)}px"></i><span>${b.d.slice(8)}</span></div>`).join('')}</div></div>
  ${noticeList(3)}`;
}

function gateBadge(L){
  const g=gate(L);
  if(L.stage!==2)return'';
  if(!g.has)return `<div class="g" style="color:var(--risk)">\uC81C\uACF5\uC77C \uBBF8\uAE30\uB85D</div>`;
  return g.ok?`<div class="g" style="color:var(--ok)">\uC219\uB824 \uACBD\uACFC \u2014 \uACC4\uC57D \uAC00\uB2A5</div>`
    :`<div class="g" style="color:var(--warn)">\uC219\uB824 D-${g.left} \u00B7 \uACC4\uC57D\uAC00\uB2A5 ${md(g.gate)} (+${g.days}\uC77C)</div>`;
}

  <div class="panel"><div class="panel-h"><h2>\uBC1C\uC8FC\uC11C \uC791\uC131</h2>
    <button class="btn ghost sm" id="fillrec">\uAD8C\uC7A5\uAC12 \uCC44\uC6B0\uAE30</button></div>
    <table><thead><tr><th>\uD488\uBAA9</th><th class="num">\uACF5\uAE09\uAC00</th><th class="num">\uAD8C\uC7A5</th><th class="num">\uADFC\uAC70</th><th class="num">\uC218\uB7C9</th></tr></thead><tbody>

      <td class="num">${won(k.supply)}</td>
      <td class="num" style="font-weight:800;color:var(--deep)" data-rec="${r.rec}">${r.rec||'-'}</td>
      <td class="num" style="color:var(--dimmer);font-size:10.5px">${r.basis} ${r.n}\uD68C</td>
      <td class="num"><input class="qty" type="number" min="0" step="5" id="q_${k.id}" placeholder="0"></td></tr>`;}).join('')}
    </tbody></table>
    <div style="margin-top:12px"><button class="btn" id="submitorder">\uBC1C\uC8FC\uC11C \uC81C\uCD9C</button></div>

    ${mine.map(o=>`<tr><td>${o.date}</td>
      <td style="font-size:11.5px;color:var(--dim)">${o.items.map(i=>{const k=sku(i.skuId);return k?esc(k.name)+' '+i.qty:'';}).join(', ')}</td>

  </div>`;
}

  const st=store(sid);

  const ex=C('sales').find(c=>c.storeId===sid&&c.date===salesDate);
  const hist=C('sales').filter(c=>c.storeId===sid).sort((a,b)=>b.date<a.date?-1:1).slice(0,14);
  return `

      ${hq?`<div><label>\uB9E4\uC7A5</label><select id="sl_store">${C('stores').map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`:''}

      <td class="num"><input class="qty" type="number" min="0" id="sd_${k.id}" value="${it?it.sold:''}" placeholder="0"></td>
      <td class="num"><input class="qty" type="number" min="0" id="wt_${k.id}" value="${it?it.waste:''}" placeholder="0"></td></tr>`;}).join('')}
    </tbody></table>
    <div style="margin-top:12px"><button class="btn" id="saveclose">\uB9C8\uAC10 \uC800\uC7A5</button>
    ${ex?'<span style="font-size:11px;color:var(--warn);margin-left:10px;font-weight:700">\uAE30\uC874 \uB9C8\uAC10 \uC218\uC815 \uC911</span>':''}</div>
  </div>

  <div class="panel"><div class="panel-h"><h2>POS \uB370\uC774\uD130 \uAC00\uC838\uC624\uAE30 (CSV)</h2><span class="meta">\uD1A0\uC2A4 \uB4F1 POS \uB0B4\uBCF4\uB0B4\uAE30 \uD30C\uC77C</span></div>
    <div class="row">
      <div style="flex:2"><label>CSV \uBD99\uC5EC\uB123\uAE30 (\uC27C\uD45C/\uD0ED \uAD6C\uBD84, \uCCAB \uC904 \uD5E4\uB354)</label>
        <textarea id="cs_raw" placeholder="\uC77C\uC790,\uD488\uBAA9,\uC218\uB7C9&#10;2026-07-31,\uC6B0\uC720\uD06C\uB9BC\uB3C4\uB11B,40&#10;...">${esc(csv.raw)}</textarea></div>
      <div style="flex:0 0 170px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end">

      <div style="display:flex;align-items:flex-end"><button class="btn ghost" id="cs_prev" style="width:100%">\uBBF8\uB9AC\uBCF4\uAE30</button></div>

    <button class="btn" id="cs_go">\uAC00\uC838\uC624\uAE30 \uC2E4\uD589 (${hq?esc(st.name):'\uB0B4 \uB9E4\uC7A5'} \uB9C8\uAC10\uC73C\uB85C \uBC18\uC601)</button>`:''}
    <div class="note">\uAC19\uC740 \uC77C\uC790\u00B7\uD488\uBAA9 \uD589\uC740 \uC218\uB7C9\uC774 \uD569\uC0B0\uB429\uB2C8\uB2E4. \uAE30\uC874 \uB9C8\uAC10\uC774 \uC788\uC73C\uBA74 \uD310\uB9E4\uC218\uB7C9\uC740 CSV \uAC12\uC73C\uB85C \uB300\uCCB4\uB418\uACE0 \uD3D0\uAE30\uC218\uB7C9\uC740 \uC720\uC9C0\uB429\uB2C8\uB2E4. \uD488\uBAA9\uBA85\uC740 \uACF5\uBC31 \uBB34\uC2DC \uD6C4 SKU\uBA85\uACFC \uC815\uD655\uD788 \uC77C\uCE58\uD574\uC57C \uD569\uB2C8\uB2E4.</div>
  </div>

  <div class="panel"><div class="panel-h"><h2>\uCD5C\uADFC \uB9C8\uAC10 \uC774\uB825</h2><span class="meta">${esc(st.name)}</span></div>
    ${hist.length?`<table><thead><tr><th>\uC77C\uC790</th><th class="num">\uB9E4\uCD9C\uC561</th><th class="num">\uD310\uB9E4</th><th class="num">\uD3D0\uAE30</th><th class="num">\uB85C\uC2A4\uC728</th></tr></thead><tbody>
    ${hist.map(c=>{const L=closingLoss(c);
      return `<tr><td>${c.date}</td><td class="num" style="font-weight:700">${won(closingRev(c))}\uC6D0</td>
      <td class="num">${L.sold}</td><td class="num">${L.waste}</td>
      <td class="num" style="color:${L.rate>=8?'var(--risk)':L.rate>=4?'var(--warn)':'var(--ok)'};font-weight:700">${L.rate.toFixed(1)}%</td></tr>`;}).join('')}
    </tbody></table>`:'<div class="empty">\uB9C8\uAC10 \uAE30\uB85D\uC774 \uC5C6\uC2B5\uB2C8\uB2E4.</div>'}
  </div>`;
}

function vSettle(){
  const m=setMonth;
  const rows=C('stores').map(s=>{
    const sup=C('orders').filter(o=>o.storeId===s.id&&o.date.slice(0,7)===m&&(o.status==='\uCD9C\uACE0'||o.status==='\uC644\uB8CC'))
      .reduce((a,o)=>a+orderAmt(o),0);
    const cs=C('sales').filter(c=>c.storeId===s.id&&c.date.slice(0,7)===m);
    const rev=cs.reduce((a,c)=>a+closingRev(c),0);
    let sold=0,waste=0;cs.forEach(c=>{const L=closingLoss(c);sold+=L.sold;waste+=L.waste;});
    const loss=sold+waste>0?waste/(sold+waste)*100:0;
    return{s,sup,rev,loss,ratio:rev>0?sup/rev*100:0};});
  const tot=rows.reduce((a,r)=>({sup:a.sup+r.sup,rev:a.rev+r.rev}),{sup:0,rev:0});
  return `
  <div class="head"><div><h1>\uC815\uC0B0 (\uBCF8\uC0AC)</h1>
    <p>\uACF5\uAE09 \uB9E4\uCD9C = \uCD9C\uACE0\u00B7\uC644\uB8CC \uBC1C\uC8FC\uC758 \uACF5\uAE09\uAC00 \uD569\uACC4 \u2014 \uC81C3\uC870\u24614\uD638\uC5D0 \uB530\uB77C \uBC00\uC9D1(\uC744)\uC5D0 \uADC0\uC18D\uB418\uB294 \uC0DD\uC0B0\u00B7\uBB3C\uB958 \uC218\uC775\uC758 \uAE30\uCD08 \uC218\uCE58</p></div>
    <div><input type="month" id="st_month" value="${m}" style="width:150px"></div></div>
  <div class="panel">
    <table><thead><tr><th>\uB9E4\uC7A5</th><th>\uAD6C\uBD84</th><th class="num">\uACF5\uAE09 \uB9E4\uCD9C(\uBC00\uC9D1)</th><th class="num">\uB9E4\uC7A5 \uB9E4\uCD9C</th><th class="num">\uACF5\uAE09/\uB9E4\uCD9C</th><th class="num">\uB85C\uC2A4\uC728</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td style="font-weight:700">${esc(r.s.name)}</td>
      <td><span class="pill ${r.s.type==='\uC9C1\uC601'?'pl-info':'pl-sig'}">${esc(r.s.type)}</span></td>
      <td class="num" style="font-weight:700">${won(r.sup)}\uC6D0</td>
      <td class="num">${won(r.rev)}\uC6D0</td>
      <td class="num" style="color:var(--dim)">${r.ratio.toFixed(1)}%</td>
      <td class="num" style="color:${r.loss>=8?'var(--risk)':r.loss>=4?'var(--warn)':'var(--ok)'}">${r.loss.toFixed(1)}%</td></tr>`).join('')}
    <tr><td style="font-weight:800">\uD569\uACC4</td><td></td>
      <td class="num" style="font-weight:800;color:var(--deep)">${won(tot.sup)}\uC6D0</td>
      <td class="num" style="font-weight:800">${won(tot.rev)}\uC6D0</td><td></td><td></td></tr>
    </tbody></table>
    <div class="note">\uB85C\uC5F4\uD2F0 \uC815\uC0B0 \uBAA8\uB4C8\uC740 \uC81C4\uC870 \uC790\uB8CC(\uAE30\uC874 \uAC00\uB9F9\uACC4\uC57D\uC11C\u00B7\uB85C\uC5F4\uD2F0 \uC0B0\uC815\uAE30\uC900) \uC218\uB839 \uD6C4 \uC694\uC728\uC744 \uBC18\uC601\uD574 \uCD94\uAC00\uD569\uB2C8\uB2E4. \uAE30\uC874 \uB9E4\uC7A5 \uB85C\uC5F4\uD2F0\uB294 \uAC11 \uADC0\uC18D\u00B7\uC2E0\uADDC \uB9E4\uC7A5\uC740 \uC744 \uADC0\uC18D\uC774\uBBC0\uB85C, \uAE30\uC900\uC77C \uB9E4\uC7A5 \uD655\uC815(\uB9AC\uC2A4\uD06C r9) \uC804\uC5D0\uB294 \uB9E4\uC7A5\uBCC4 \uADC0\uC18D \uAD6C\uBD84\uC744 \uD655\uC815\uD558\uC9C0 \uB9C8\uC2ED\uC2DC\uC624.</div>
  </div>`;
}

function noticeList(limit){
  const ns=[...C('notices')].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.date<a.date?-1:1));
  const arr=limit?ns.slice(0,limit):ns;
  return `<div class="panel"><div class="panel-h"><h2>\uACF5\uC9C0${limit?' (\uCD5C\uADFC)':''}</h2>
    ${limit?`<button class="btn ghost sm" data-tab="notice">\uC804\uCCB4 \uBCF4\uAE30</button>`:''}</div>
    ${arr.length?arr.map(n=>`<div style="padding:10px 0;border-bottom:1px solid #F1EDE5">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${n.pinned?'<span class="pill pl-sig">\uACE0\uC815</span>':''}
        <b style="font-size:13px">${esc(n.title)}</b>
        <span style="font-size:10.5px;color:var(--dimmer)">${n.date}</span>
        ${isHQ()&&!limit?`<button class="btn danger sm" data-ndel="${n.id}" style="margin-left:auto">\uC0AD\uC81C</button>`:''}</div>
      <div style="font-size:12.5px;color:var(--dim);margin-top:4px;white-space:pre-wrap">${esc(n.body)}</div>
    </div>`).join(''):'<div class="empty">\uACF5\uC9C0\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4.</div>'}</div>`;
}

/* ---------- csv ---------- */
function parseCsvText(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(lines.length<2)return null;
  const dl=[',','\t',';'].map(d=>({d,n:lines[0].split(d).length})).sort((a,b)=>b.n-a.n)[0].d;
  const splitLine=l=>{
    const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
      else{if(ch==='"')q=true;else if(ch===dl){out.push(cur);cur='';}else cur+=ch;}}
    out.push(cur);return out.map(s=>s.trim());};
  const head=splitLine(lines[0]);
  const rows=lines.slice(1).map(splitLine);
  const guess=(names)=>{const i=head.findIndex(h=>names.some(n=>h.replace(/\s/g,'').toLowerCase().includes(n)));return i>=0?i:0;};
  return{head,rows,map:{d:guess(['\uC77C\uC790','\uB0A0\uC9DC','date']),n:guess(['\uD488\uBAA9','\uBA54\uB274','\uC0C1\uD488','item','name']),q:guess(['\uC218\uB7C9','\uD310\uB9E4','qty','count'])}};
}
function normDate(s){
  let x=s.replace(/[./]/g,'-').trim();
  if(/^\d{8}$/.test(x))x=x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6);
  const m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  const m2=x.match(/^(\d{1,2})-(\d{1,2})$/);
  if(m2)return today().slice(0,4)+'-'+pad(+m2[1])+'-'+pad(+m2[2]);
  return null;
}
function buildPreview(){
  const{rows,map}=csv;
  const norm=s=>s.replace(/\s/g,'');
  const byName={};C('skus').forEach(k=>byName[norm(k.name)]=k.id);
  const agg={};const missSet=new Set();let cnt=0;
  rows.forEach(r=>{
    const d=normDate(r[map.d]||'');const nm=norm(r[map.n]||'');const q=+String(r[map.q]||'').replace(/[^\d.-]/g,'');
    if(!d||!nm||!(q>0))return;
    cnt++;
    const kid=byName[nm];
    if(!kid){missSet.add(r[map.n]);return;}
    agg[d]=agg[d]||{};agg[d][kid]=(agg[d][kid]||0)+q;});
  csv.preview={agg,days:Object.keys(agg).length,rows:cnt,
    ok:new Set(Object.values(agg).flatMap(o=>Object.keys(o))).size,
    miss:[...missSet]};
}
function runImport(sid){
  const{agg}=csv.preview;let made=0;
  Object.entries(agg).forEach(([d,items])=>{
    const ex=C('sales').find(c=>c.storeId===sid&&c.date===d);
    const waste={};if(ex)ex.items.forEach(i=>waste[i.skuId]=i.waste);
    const merged={};
    Object.entries(items).forEach(([kid,q])=>{merged[kid]={skuId:kid,sold:q,waste:waste[kid]||0};});
    if(ex)ex.items.forEach(i=>{if(!merged[i.skuId]&&i.waste>0)merged[i.skuId]={skuId:i.skuId,sold:0,waste:i.waste};});
    const obj=ex?{...ex}:{id:uid('c'),storeId:sid,date:d};
    obj.items=Object.values(merged);
    up('sales',obj);made++;});
  log('POS CSV \uAC00\uC838\uC624\uAE30: '+made+'\uAC1C \uC77C\uC790 \uBC18\uC601 ('+(store(sid)||{}).name+')');
  save();csv={raw:'',rows:null,map:null,preview:null};render();
}

function moveLead(id,dir){
  const L=C('leads').find(x=>x.id===id);if(!L)return;
  const ns=Math.max(0,Math.min(5,L.stage+dir));
  if(ns===L.stage)return;
  if(dir>0&&L.stage===2&&ns===3){
    if(!L.docDate){
      alert('\uC815\uBCF4\uACF5\uAC1C\uC11C\u00B7\uC778\uADFC\uAC00\uB9F9\uC810 \uD604\uD669\uBB38\uC11C \uC81C\uACF5\uC77C\uC774 \uAE30\uB85D\uB418\uC9C0 \uC54A\uC558\uC2B5\uB2C8\uB2E4.\n\uC81C\uACF5 \uC804 \uAC00\uB9F9\uAE08 \uC218\uB839\u00B7\uAC00\uB9F9\uACC4\uC57D \uCCB4\uACB0\uC740 \uAC00\uB9F9\uC0AC\uC5C5\uBC95 \uC81C7\uC870\u2462 \uC704\uBC18\uC785\uB2C8\uB2E4.');
      return;}
    const g=gate(L);
    if(!g.ok){
      if(!confirm('\uC219\uB824\uAE30\uAC04 \uBBF8\uACBD\uACFC \u2014 \uACC4\uC57D \uAC00\uB2A5\uC77C '+g.gate+' (\uC81C\uACF5\uC77C+'+g.days+'\uC77C).\n\uADF8 \uC804\uC758 \uAC00\uB9F9\uAE08 \uC218\uB839\u00B7\uACC4\uC57D \uCCB4\uACB0\uC740 \uAC00\uB9F9\uC0AC\uC5C5\uBC95 \uC81C7\uC870\u2462 \uC704\uBC18 \uC18C\uC9C0\uAC00 \uC788\uC2B5\uB2C8\uB2E4.\n\uC774\uBBF8 \uBC1C\uC0DD\uD55C \uACC4\uC57D\uC758 \uC0AC\uD6C4 \uAE30\uB85D\uC73C\uB85C\uB9CC \uC9C4\uD589\uD569\uB2C8\uAE4C?'))return;
      L.flag=true;log('\uC219\uB824\uAE30\uAC04 \uBBF8\uC900\uC218 \uC0AC\uD6C4\uAE30\uB85D: '+L.name);}
  }
  if(dir>0&&L.stage===4&&ns===5){
    const id2=uid('s');
    up('stores',{id:id2,name:L.storeName||((L.area||L.name)+' \uC2E0\uADDC\uC810'),
      type:'\uAC00\uB9F9',region:(L.area||'').split(' ')[0]||'',addr:L.area||'',
      phone:L.phone||'',openDate:today()});
    DB.sec.codes[id2]=genCode();DB.sec.mt=Date.now();
    log('\uAC00\uB9F9\uC810 \uC624\uD508 \uB4F1\uB85D: '+(L.storeName||L.name));
  }
  L.stage=ns;up('leads',L);
  log('\uB9AC\uB4DC \uB2E8\uACC4\uC774\uB3D9: '+L.name+' \u2192 '+STAGES[ns]);
  render();
}

/* ---------- boot ---------- */
async function boot(){
  DB=await sget(KDB,true);
  if(!DB){
    const v1=await sget(KV1,false);
    setupHasV1=!!(v1&&v1.skus);
    ph='setup';render();return;
  }
  SES=await sget(KSES,false);
  if(SES&&SES.who!=='hq'&&!store(SES.who))SES=null;
  ph=SES?'app':'gate';
  render();
}
boot();
})();
</script>
